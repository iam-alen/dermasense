<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up · DermaSense</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-mode="signup"><nav id="nav"></nav><main><section>
<div class="auth card"><h2>Create your profile</h2><p class="muted">It takes a minute. Your scan and routine stay with you.</p>
<form id="f"><label for="name">Your name</label><input id="name" autocomplete="name" required>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="pw">Password (8+ characters)</label><input id="pw" type="password" autocomplete="new-password" required>
<button class="btn" type="submit">Create account</button></form><div id="msg"></div>
<p class="muted">Already registered? <a href="login.html">Log in</a></p></div>
</section></main><footer id="foot"></footer><script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
